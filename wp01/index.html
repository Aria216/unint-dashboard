function statusBadge(s){
 if(s==='Done')return '<span class="badge b-done">DONE</span>';
 if(s==='In progress')return '<span class="badge b-wip">IN PROGRESS</span>';
 if(s==='To do'||s==='Todo')return '<span class="badge b-todo">TO DO</span>';
 if(s==='Out')return '<span class="badge b-out">OUT</span>';

 return '<span class="b-none">—</span>';}
function npill(s){
 if(s==='Done')return '<span class="npill b-done">DONE</span>';
 if(s==='In progress')return '<span class="npill b-wip">IN PROGRESS</span>';
 if(s==='Out')return '<span class="npill b-out">OUT</span>';
 return '<span class="npill b-todo">TO DO</span>';}

/* MATRICE */
function buildMat(){
 let h='';
 for(const r of DATA.rows){
  if(r.kind==='rel'){h+=`<tr class="relrow" data-g="${r.group}"><td class="rid">${r.id}</td><td>${r.att.replace(/^RELEASE[^:]*:\s*/,'RELEASE: ')}</td><td>–</td><td>–</td><td>–</td><td class="date">${fmt(r.start)} → ${fmt(r.end)}</td><td>${statusBadge('Milestone')}</td></tr>`;continue;}
  if(r.kind==='sec'){h+=`<tr class="secrow" data-g="${r.group}"><td colspan="7">${r.att}</td></tr>`;continue;}
  h+=`<tr data-g="${r.group}" data-id="${r.id||''}" data-txt="${(r.att||'').toLowerCase()} ${(r.id||'')}">`+
     `<td><span class="rid">${r.id||'·'}</span></td>`+
     `<td>${r.att||''}</td><td>${r.area||'—'}</td><td>${r.owner||'—'}</td>`+
     `<td>${r.rel?`<span class="relbadge">${r.rel}</span>`:'—'}</td>`+
     `<td class="date">${fmt(r.start)} → ${fmt(r.end)}</td><td>${statusBadge(r.status)}</td></tr>`;
 }
 document.getElementById('tbody').innerHTML=h;
}
/* FLUSSO */
function buildFlow(){
 const f=DATA.flusso;
 const cv=document.getElementById('canvas');
 cv.style.width=f.W+'px';cv.style.height=f.H+'px';
 const svg=document.getElementById('edges');
 svg.setAttribute('viewBox',`0 0 ${f.W} ${f.H}`);svg.style.width=f.W+'px';svg.style.height=f.H+'px';
 const byId={};f.nodes.forEach(n=>byId[n.id]=n);
 let ep='';
 for(const e of f.edges){const a=byId[e.f],b=byId[e.t];if(!a||!b)continue;
  const x1=a.x+f.CW,y1=a.y+f.CH/2,x2=b.x,y2=b.y+f.CH/2,dx=Math.max(40,(x2-x1)/2);
  ep+=`<path class="edge" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"/>`;}
 svg.innerHTML=ep;
 // remove old nodes
 [...cv.querySelectorAll('.node')].forEach(n=>n.remove());
 for(const n of f.nodes){
  const el=document.createElement('div');
  el.className=`node g-${n.group}`;el.style.left=n.x+'px';el.style.top=n.y+'px';
  el.dataset.g=n.group;el.dataset.id=n.id;el.dataset.txt=(n.att||'').toLowerCase()+' '+n.id;
  el.innerHTML=`<div class="nid">${n.id}</div><div class="natt">${n.att}</div>`+
   `<div class="nfoot"><span class="ndate">${fmt(n.start)}→${fmt(n.end)}</span>${npill(n.status)}</div>`;
  cv.appendChild(el);}
}

function applyFilters(){

  const g=el.dataset.g, txt=el.dataset.txt||'', id=el.dataset.id||'';
